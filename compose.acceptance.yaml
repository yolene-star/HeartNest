name: heartnest-acceptance
services:
  backend:
    image: heartnest-acceptance-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      COMPANION_DB: /app/data/runtime/acceptance.sqlite3
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-18}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - acceptance-data:/app/data/runtime
  frontend:
    image: heartnest-acceptance-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  acceptance-data:
