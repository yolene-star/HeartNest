name: emotion-companion
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      COMPANION_DB: /app/data/runtime/companion.sqlite3
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-18}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - companion-data:/app/data/runtime
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  companion-data:
