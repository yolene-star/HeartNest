name: emotion-companion
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      COMPANION_DB: /app/data/runtime/companion.sqlite3
    volumes:
      - companion-data:/app/data/runtime
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  companion-data:
